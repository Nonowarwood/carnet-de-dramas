<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de dramas</title>
<meta name="description" content="Trente dramas coréens, japonais et chinois regardés depuis janvier 2025 : mes notes, celles du public, et mes critiques.">

<link rel="stylesheet" href="assets/style.css">
<script>(function(){var d=document.documentElement;d.classList.add("js");try{var p=JSON.parse(localStorage.getItem("carnet:prefs")||"{}"),q=new URLSearchParams(location.search);if(q.get("lang"))p.langue=q.get("lang");if(q.get("theme"))p.theme=q.get("theme");if(q.get("lang")||q.get("theme"))localStorage.setItem("carnet:prefs",JSON.stringify(p));if(p.theme&&p.theme!=="defaut")d.setAttribute("data-theme",p.theme);if(p.langue)d.setAttribute("lang",p.langue);}catch(e){}})();</script>
</head>
<body class="ring-page" data-page="accueil">

<header class="bar">
  <a class="bar__logo" href="index.html">Dramas<sup>26</sup></a>
  <a class="bar__link" href="carnet.html" data-i18n="nav.carnet"></a>
  <a class="bar__link" href="visionnages.html" data-i18n="nav.visionnages"></a>
  <a class="bar__link bar__link--optionnel" href="moi.html" data-i18n="nav.portrait"></a>
  <span class="bar__spacer"></span>
  <button class="bar__guide" type="button" data-guide><span class="bar__guide__rond">?</span><span data-i18n="nav.guide"></span></button>
  <button class="bar__reglages" type="button" data-reglages><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1 4.5h9M13 4.5h2M1 11.5h3M7 11.5h8"/><circle cx="11.5" cy="4.5" r="1.7"/><circle cx="5.5" cy="11.5" r="1.7"/></svg><span data-i18n="nav.reglages"></span></button>
</header>

<div class="ring-progress"><div class="ring-progress__bar" id="progress"></div></div>

<div class="ring" id="ring" tabindex="0" role="group"
     data-i18n-attr="aria-label:ring.aria">

  <div class="ring__stage" id="stage"></div>

  <p class="ring-hint mono" data-i18n="ring.indice"></p>

  <div class="ring-caption">
    <div>
      <span class="mono" id="cap-num"></span>
      <h1 class="ring-caption__title" id="cap-titre"></h1>
      <p class="ring-caption__meta mono" id="cap-meta"></p>
    </div>
    <div class="ring-caption__aside">
      <div class="ring-caption__score" id="cap-note"></div>
      <a class="ring-caption__cta mono" href="carnet.html">
        <span data-i18n="ring.entrer"></span>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 6h10M6.5 1.5 11 6l-4.5 4.5"/></svg>
      </a>
    </div>
  </div>

</div>

<script src="assets/data.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var ring = document.getElementById("ring");
  var stage = document.getElementById("stage");
  var progress = document.getElementById("progress");
  var capNum = document.getElementById("cap-num");
  var capTitre = document.getElementById("cap-titre");
  var capMeta = document.getElementById("cap-meta");
  var capNote = document.getElementById("cap-note");

  preparerConsensus(DRAMAS);

  var N = DRAMAS.length;
  var PAS = 360 / N;              // écart angulaire entre deux panneaux
  var rayon = 0;                  // recalculé à chaque redimensionnement

  /* ---------------- Construction des panneaux ---------------- */

  stage.innerHTML = DRAMAS.map(function (d, i) {
    var img = affiche(d);
    var contenu = img
      ? '<img src="' + img + '" alt="Affiche de ' + esc(d.titre) + '" loading="' +
        (i < 10 ? "eager" : "lazy") + '" draggable="false">'
      : '<div class="ring__fallback"><span class="mono">' + numero(i) + "</span>" +
        "<b>" + esc(d.titre) + "</b></div>";
    return '<div class="ring__item" data-i="' + i + '">' + contenu + "</div>";
  }).join("");

  var panneaux = Array.prototype.slice.call(stage.children);

  /* ---------------- Géométrie ---------------- */

  function dimensionner() {
    var largeur = Math.max(150, Math.min(300, Math.round(window.innerWidth * 0.19)));
    document.documentElement.style.setProperty("--card-w", largeur + "px");

    // Rayon tel que les panneaux se répartissent sans se chevaucher.
    rayon = (largeur / 2) / Math.tan(Math.PI / N) * 1.12;

    panneaux.forEach(function (el, i) {
      el.style.transform = "rotateY(" + (-i * PAS) + "deg) translateZ(" + rayon + "px)";
    });
  }

  /* ---------------- Boucle d'animation ---------------- */

  var angle = 0;        // rotation courante, en degrés
  var vitesse = 0;      // inertie après un lâcher
  var DERIVE = 0.035;   // rotation continue, façon plateau tournant
  var reprise = 0;      // frames avant reprise de la dérive
  var attrape = false;
  var dernierIndex = -1;
  var sobre = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function indexDeFace() {
    // Le panneau i est de face quand angle - i * PAS ≡ 0 (mod 360).
    var i = Math.round(angle / PAS) % N;
    return (i + N) % N;
  }

  function majLegende() {
    var i = indexDeFace();
    if (i === dernierIndex) return;
    dernierIndex = i;

    var d = DRAMAS[i];
    capNum.textContent = numero(i) + " / " + N;
    capMeta.textContent = ligneMeta(d, true);
    capNote.innerHTML =
      d.note === null
        ? '<span class="mono">Pas encore notée</span>'
        : jauge(d.note) + "<span>" + formatNote(d.note) + "/5</span>";

    // Le titre bascule verticalement à chaque changement de façade.
    if (sobre) {
      capTitre.textContent = d.titre;
    } else {
      capTitre.innerHTML = '<span class="bascule"><span>' + esc(d.titre) + "</span></span>";
    }

    progress.style.width = ((i + 1) / N) * 100 + "%";
  }

  function frame() {
    if (!attrape) {
      angle += vitesse;
      vitesse *= 0.94;
      if (Math.abs(vitesse) < 0.002) vitesse = 0;
      if (reprise > 0) reprise--;
      else if (!sobre) angle += DERIVE;
    }
    stage.style.transform = "translateZ(" + -rayon + "px) rotateY(" + angle + "deg)";
    majLegende();
    requestAnimationFrame(frame);
  }

  /* ---------------- Interactions ---------------- */

  var xDepart = 0, angleDepart = 0, dernierX = 0;

  ring.addEventListener("pointerdown", function (e) {
    // Un clic sur un lien ou un bouton posé au-dessus du cylindre ne doit pas
    // déclencher la prise : sinon la capture du pointeur avale le clic.
    if (e.target.closest && e.target.closest("a, button")) return;
    attrape = true;
    ring.classList.add("is-dragging");
    ring.setPointerCapture(e.pointerId);
    xDepart = dernierX = e.clientX;
    angleDepart = angle;
    vitesse = 0;
  });

  ring.addEventListener("pointermove", function (e) {
    if (!attrape) return;
    // 0,22°/px : un balayage d'écran fait défiler une bonne partie du cylindre.
    angle = angleDepart + (e.clientX - xDepart) * 0.22;
    vitesse = (e.clientX - dernierX) * 0.22;
    dernierX = e.clientX;
  });

  function relacher(e) {
    if (!attrape) return;
    attrape = false;
    ring.classList.remove("is-dragging");
    if (e.pointerId !== undefined && ring.hasPointerCapture(e.pointerId)) {
      ring.releasePointerCapture(e.pointerId);
    }
    reprise = 180; // ~3 s avant que la dérive ne reprenne
  }

  ring.addEventListener("pointerup", relacher);
  ring.addEventListener("pointercancel", relacher);

  ring.addEventListener("wheel", function (e) {
    e.preventDefault();
    var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    vitesse += delta * 0.012;
    reprise = 180;
  }, { passive: false });

  ring.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { vitesse += PAS * 0.35; reprise = 180; }
    else if (e.key === "ArrowLeft") { vitesse -= PAS * 0.35; reprise = 180; }
    else return;
    e.preventDefault();
  });

  window.addEventListener("resize", dimensionner);

  dimensionner();
  requestAnimationFrame(frame);
})();
</script>
<script src="assets/anim.js"></script>
<script src="assets/guide.js"></script>
<script src="assets/prefs.js"></script>

</body>
</html>
