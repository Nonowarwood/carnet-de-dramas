<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ce que mes visionnages disent de moi — Carnet de dramas</title>
<meta name="description" content="Le portrait chiffré de 30 dramas : heures passées, acteurs récurrents, années, diffuseurs, origines et genres de prédilection.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><rect x='7' y='7' width='18' height='18' fill='%23ff5c2b'/></svg>">
<link rel="stylesheet" href="assets/style.css">
<script>(function(){var d=document.documentElement;d.classList.add("js");try{var p=JSON.parse(localStorage.getItem("carnet:prefs")||"{}"),q=new URLSearchParams(location.search);if(q.get("lang"))p.langue=q.get("lang");if(q.get("theme"))p.theme=q.get("theme");if(q.get("lang")||q.get("theme"))localStorage.setItem("carnet:prefs",JSON.stringify(p));if(p.theme&&p.theme!=="defaut")d.setAttribute("data-theme",p.theme);if(p.langue)d.setAttribute("lang",p.langue);}catch(e){}})();</script>
</head>
<body data-page="portrait">

<div class="scroll-progress"><div class="scroll-progress__bar"></div></div>

<header class="bar">
  <a class="bar__logo" href="index.html">Dramas<sup>26</sup></a>
  <a class="bar__link" href="carnet.html" data-i18n="nav.carnet"></a>
  <a class="bar__link" href="visionnages.html" data-i18n="nav.visionnages"></a>
  <a class="bar__link bar__link--optionnel" href="moi.html" aria-current="page" data-i18n="nav.portrait"></a>
  <span class="bar__spacer"></span>
  <button class="bar__guide" type="button" data-guide><span class="bar__guide__rond">?</span><span data-i18n="nav.guide"></span></button>
  <button class="bar__reglages" type="button" data-reglages><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1 4.5h9M13 4.5h2M1 11.5h3M7 11.5h8"/><circle cx="11.5" cy="4.5" r="1.7"/><circle cx="5.5" cy="11.5" r="1.7"/></svg><span data-i18n="nav.reglages"></span></button>
</header>

<div class="wrap opening" style="padding-bottom:2rem">
  <p class="opening__kicker reveal" data-i18n="p.chapeau"></p>
  <h1 class="opening__title display" data-split data-i18n="p.titre"></h1>
</div>

<main>

  <!-- ------------------------------ 1. Le temps ------------------------------ -->
  <section class="wrap portrait-section viz viz--temps" id="section-temps">
    <div class="portrait-head reveal">
      <span class="section-num mono"><i></i><span data-i18n="p.1.num"></span></span>
      <h2 data-i18n="p.1.h"></h2>
      <p id="temps-phrase"></p>
    </div>

    <p class="hero-figure reveal"><span id="hero-heures" data-decimales="0">0</span><small data-i18n="p.1.hero"></small></p>

    <div class="figures reveal" id="temps-chiffres" style="margin:2.5rem 0 3rem"></div>

    <div class="portrait-head reveal" style="margin-bottom:1.5rem">
      <h2 style="font-size:clamp(1.25rem,2.5vw,1.6rem)" data-i18n="p.1.h2"></h2>
      <p data-i18n="p.1.p2"></p>
    </div>
    <div class="reveal" id="graph-temps"></div>
  </section>

  <!-- ------------------------------ 2. Le rythme ------------------------------ -->
  <section class="wrap portrait-section viz viz--temps" id="section-rythme">
    <div class="portrait-head reveal">
      <span class="section-num mono"><i></i><span data-i18n="p.2.num"></span></span>
      <h2 data-i18n="p.2.h"></h2>
      <p id="rythme-phrase"></p>
    </div>

    <div class="figures reveal" id="rythme-chiffres" style="margin-bottom:3rem"></div>

    <div class="reveal" id="graph-rythme"></div>
  </section>

  <!-- ------------------------------ 3. Les visages ------------------------------ -->
  <section class="wrap portrait-section viz viz--acteurs" id="section-acteurs">
    <div class="portrait-head reveal">
      <span class="section-num mono"><i></i><span data-i18n="p.3.num"></span></span>
      <h2 data-i18n="p.3.h"></h2>
      <p id="acteurs-phrase"></p>
    </div>
    <div class="reveal" id="graph-acteurs"></div>
  </section>

  <!-- ------------------------------ 3. Les années ------------------------------ -->
  <section class="wrap portrait-section viz viz--annees" id="section-annees">
    <div class="portrait-head reveal">
      <span class="section-num mono"><i></i><span data-i18n="p.4.num"></span></span>
      <h2 data-i18n="p.4.h"></h2>
      <p id="annees-phrase"></p>
    </div>
    <div class="reveal" id="graph-annees"></div>
  </section>

  <!-- ------------------------------ 4. Les diffuseurs ------------------------------ -->
  <section class="wrap portrait-section viz viz--chaines" id="section-chaines">
    <div class="portrait-head reveal">
      <span class="section-num mono"><i></i><span data-i18n="p.5.num"></span></span>
      <h2 data-i18n="p.5.h"></h2>
      <p id="chaines-phrase"></p>
    </div>
    <div class="reveal" id="graph-chaines"></div>
  </section>

  <!-- ------------------------------ 5. Les origines ------------------------------ -->
  <section class="wrap portrait-section viz" id="section-pays">
    <div class="portrait-head reveal">
      <span class="section-num mono"><i></i><span data-i18n="p.6.num"></span></span>
      <h2 data-i18n="p.6.h"></h2>
      <p id="pays-phrase"></p>
    </div>
    <div class="reveal" id="graph-pays"></div>
  </section>

  <!-- ------------------------------ 6. Les genres ------------------------------ -->
  <section class="wrap portrait-section viz viz--genres" id="section-genres">
    <div class="portrait-head reveal">
      <span class="section-num mono"><i></i><span data-i18n="p.7.num"></span></span>
      <h2 data-i18n="p.7.h"></h2>
      <p id="genres-phrase"></p>
    </div>
    <div class="reveal" id="graph-genres"></div>

    <div class="portrait-head reveal" style="margin:3.5rem 0 1.5rem">
      <h2 style="font-size:clamp(1.25rem,2.5vw,1.6rem)" data-i18n="p.7.h2"></h2>
      <p data-i18n="p.7.p2"></p>
    </div>
    <div class="reveal" id="genres-detail"></div>

    <div class="portrait-head reveal" style="margin:3.5rem 0 1.5rem">
      <h2 style="font-size:clamp(1.25rem,2.5vw,1.6rem)" data-i18n="p.7.h3"></h2>
      <p data-i18n="p.7.p3"></p>
    </div>
    <div class="reveal" id="graph-genres-notes"></div>
  </section>

  <!-- ------------------------------ 8. L'écart ------------------------------ -->
  <section class="wrap portrait-section viz viz--ecart" id="section-ecart">
    <div class="portrait-head reveal">
      <span class="section-num mono"><i></i><span data-i18n="p.8.num"></span></span>
      <h2 data-i18n="p.8.h"></h2>
      <p id="ecart-phrase"></p>
    </div>

    <div class="figures reveal" id="ecart-chiffres" style="margin-bottom:3rem"></div>

    <div class="reveal" id="graph-ecart"></div>
  </section>

</main>

<footer class="wrap pied" id="pied"></footer>

<script src="assets/data.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script src="assets/charts.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  preparerConsensus(DRAMAS);

  /* ---------------- Agrégats ---------------- */

  function compter(cles) {
    var m = {};
    cles.forEach(function (c) { if (c) m[c] = (m[c] || 0) + 1; });
    return Object.keys(m)
      .map(function (k) { return { label: k, valeur: m[k] }; })
      .sort(function (a, b) { return b.valeur - a.valeur; });
  }

  // « TVING tvN » désigne la même chaîne que « tvN », à un service de
  // rattrapage près : on regroupe pour ne pas éclater le décompte.
  var CHAINES = { "TVING tvN": "tvN" };

  var minutes = DRAMAS.map(function (d) { return d.episodesNb * d.dureeEp; });
  var totalMin = minutes.reduce(function (a, b) { return a + b; }, 0);
  var totalEp = DRAMAS.reduce(function (a, d) { return a + d.episodesNb; }, 0);
  var dureeMoy = Math.round(totalMin / totalEp);

  // Point de départ lu dans les données, pas écrit en dur.
  var premierMois = DRAMAS[0].mois;
  var debut = new Date(+premierMois.slice(0, 4), +premierMois.slice(5) - 1, 1);
  var jours = Math.max(1, Math.round((Date.now() - debut) / 86400000));

  /* ---------------- 1. Le temps ---------------- */

  $("hero-heures").setAttribute("data-compte", Math.round(totalMin / 60));

  $("temps-phrase").textContent = t("p.1.p", totalEp, Math.round(totalMin / 60),
    moisEnClair(premierMois), Math.round(totalMin / jours));

  $("temps-chiffres").innerHTML = [
    [Math.round(totalMin / 60 / 24), 0, t("p.1.jours")],
    [totalEp, 0, t("p.1.eps")],
    [dureeMoy, 0, t("p.1.minEp")],
    [Math.round(totalMin / jours), 0, t("p.1.minJour")]
  ].map(function (f) {
    return '<div class="figure"><span class="figure__value">' +
      '<span data-compte="' + f[0] + '" data-decimales="' + f[1] + '">0</span></span>' +
      '<span class="figure__label mono">' + f[2] + "</span></div>";
  }).join("");

  Viz.barres($("graph-temps"), DRAMAS
    .map(function (d) {
      return {
        label: d.titre,
        valeur: Math.round((d.episodesNb * d.dureeEp) / 60 * 10) / 10,
        image: affiche(d),
        detail: d.titre + " — " + t("viz.epDe", d.episodesNb, d.dureeEp)
      };
    })
    .sort(function (a, b) { return b.valeur - a.valeur; })
    .slice(0, 8),
    { unite: "h", decimales: 1, colonne: t("viz.serie"), mesure: t("viz.heures") });


  /* ---------------- 2. Le rythme ---------------- */

  // Tous les mois de la période, y compris ceux sans visionnage : un creux
  // dans le rythme est une information.
  var parMois = {};
  DRAMAS.forEach(function (d) { parMois[d.mois] = (parMois[d.mois] || 0) + 1; });

  var calendrier = moisEntre(DRAMAS[0].mois, DRAMAS[DRAMAS.length - 1].mois)
    .map(function (m) { return { mois: m, n: parMois[m] || 0 }; });

  var creux = calendrier.filter(function (m) { return m.n === 0; });
  var charge = calendrier.slice().sort(function (a, b) { return b.n - a.n; })[0];

  $("rythme-phrase").textContent = t("p.2.p", calendrier.length,
    (Math.round(DRAMAS.length / calendrier.length * 10) / 10).toString().replace(".", ","),
    moisEnClair(charge.mois), charge.n, creux.length);

  $("rythme-chiffres").innerHTML = [
    [charge.n, t("p.2.max")],
    [creux.length, t("p.2.creux")],
    [calendrier.length, t("p.2.mois")]
  ].map(function (f) {
    return '<div class="figure"><span class="figure__value">' +
      '<span data-compte="' + f[0] + '" data-decimales="0">0</span></span>' +
      '<span class="figure__label mono">' + f[1] + "</span></div>";
  }).join("");

  Viz.colonnes($("graph-rythme"), calendrier.map(function (m) {
    return {
      label: m.mois.slice(5) + "/" + m.mois.slice(2, 4),
      valeur: m.n,
      detail: moisEnClair(m.mois) + " — " +
        (m.n === 0 ? t("viz.aucuneSerie") : t(m.n > 1 ? "viz.desSeries" : "viz.uneSerie", m.n))
    };
  }), { unite: t("viz.seriesU"), colonne: t("viz.mois"), mesure: t("viz.seriesTerminees") });

  /* ---------------- 3. Les visages ---------------- */

  var acteurs = {};
  DRAMAS.forEach(function (d) {
    d.roles.forEach(function (r) {
      (acteurs[r[0]] = acteurs[r[0]] || []).push(d.titre);
    });
  });

  var recurrents = Object.keys(acteurs)
    .map(function (a) { return { label: a, valeur: acteurs[a].length, titres: acteurs[a] }; })
    .filter(function (a) { return a.valeur >= 2; })
    .sort(function (a, b) { return b.valeur - a.valeur; })
    .slice(0, 10);

  $("acteurs-phrase").textContent = t("p.3.p", recurrents[0].label,
    recurrents[0].valeur, recurrents.length);

  Viz.barres($("graph-acteurs"), recurrents.map(function (a) {
    return {
      label: a.label,
      valeur: a.valeur,
      image: "assets/people/" + slug(a.label) + ".jpg",
      detail: a.label + " — " + a.titres.join(", ")
    };
  }), { unite: t("viz.seriesU"), colonne: t("viz.acteur"), mesure: t("viz.rolesPrincipaux") });

  /* ---------------- 4. Les années ---------------- */

  var parAnnee = {};
  DRAMAS.forEach(function (d) { parAnnee[d.annee] = (parAnnee[d.annee] || 0) + 1; });
  var annees = Object.keys(parAnnee).sort();
  var pointe = annees.slice().sort(function (a, b) { return parAnnee[b] - parAnnee[a]; })[0];

  $("annees-phrase").textContent = t("p.4.p", annees[0], annees[annees.length - 1],
    pointe, parAnnee[pointe]);

  Viz.colonnes($("graph-annees"), annees.map(function (a) {
    return { label: a, valeur: parAnnee[a], detail: a + " — " + parAnnee[a] + " titres" };
  }), { unite: t("viz.titresU"), colonne: t("viz.annee"), mesure: t("viz.titresU") });

  /* ---------------- 5. Les diffuseurs ---------------- */

  var chaines = compter(DRAMAS.map(function (d) {
    return CHAINES[d.chaine] || d.chaine;
  }));

  $("chaines-phrase").textContent = t("p.5.p", chaines[0].label, chaines[0].valeur,
    chaines[1].label, chaines[1].valeur, chaines.length - 2);

  Viz.barres($("graph-chaines"), chaines, {
    unite: t("viz.seriesU"), colonne: t("viz.diffuseur"), mesure: t("viz.seriesU")
  });

  /* ---------------- 6. Les origines ---------------- */

  var pays = compter(DRAMAS.map(function (d) { return nomPays(d.pays); }));

  $("pays-phrase").textContent = t("p.6.p");

  Viz.empilee($("graph-pays"), pays);

  /* ---------------- 7. Les genres ---------------- */

  var genres = {};
  DRAMAS.forEach(function (d) {
    d.genres.forEach(function (g) { (genres[g] = genres[g] || []).push(d); });
  });

  var parVolume = Object.keys(genres)
    .map(function (g) { return { label: nomGenre(g), valeur: genres[g].length }; })
    .sort(function (a, b) { return b.valeur - a.valeur; })
    .slice(0, 10);

  $("genres-phrase").textContent = t("p.7.p", genres["Romance"].length,
    genres["Drame"].length, genres["Comédie"].length, genres["Scolaire"].length);

  Viz.barres($("graph-genres"), parVolume, {
    unite: t("viz.seriesU"), colonne: t("viz.genre"), mesure: t("viz.seriesU")
  });

  // Index des genres : les genres portés par au moins deux séries ont leur
  // ligne ; les genres uniques sont regroupés en fin de bloc plutôt que
  // d'occuper chacun une ligne pour un seul titre.
  var classes = Object.keys(genres).sort(function (a, b) {
    return genres[b].length - genres[a].length || a.localeCompare(b, "fr");
  });

  $("genres-detail").innerHTML =
    '<div class="genres">' +
    classes.filter(function (g) { return genres[g].length > 1; }).map(function (g) {
      return (
        '<div class="genre">' +
        '<a class="genre__nom" href="visionnages.html?genre=' + encodeURIComponent(g) + '">' +
        esc(nomGenre(g)) + '<span class="mono">' + genres[g].length + "</span></a>" +
        '<p class="genre__titres">' +
        genres[g].map(function (d) { return "<span>" + esc(d.titre) + "</span>"; }).join("") +
        "</p></div>"
      );
    }).join("") +
    "</div>" +
    (function () {
      var uniques = classes.filter(function (g) { return genres[g].length === 1; });
      if (!uniques.length) return "";
      return '<p class="genres__uniques">' + t("p.7.uniques", uniques.length) +
        uniques.map(function (g) {
          return "<b>" + esc(nomGenre(g)) + "</b> (" + esc(genres[g][0].titre) + ")";
        }).join(", ") + ".</p>";
    })();

  // Moyenne par genre, restreinte aux genres assez représentés pour
  // qu'une moyenne ait un sens.
  var parNote = Object.keys(genres)
    .map(function (g) {
      var notes = genres[g].map(function (d) { return d.note; })
                           .filter(function (n) { return n !== null; });
      return {
        label: g,
        valeur: Math.round(notes.reduce(function (a, b) { return a + b; }, 0) / notes.length * 100) / 100,
        n: notes.length
      };
    })
    .filter(function (g) { return g.n >= 3; })
    .sort(function (a, b) { return b.valeur - a.valeur; });

  Viz.barres($("graph-genres-notes"), parNote.map(function (g) {
    return {
      label: nomGenre(g.label),
      valeur: g.valeur,
      detail: nomGenre(g.label) + " — " + String(g.valeur).replace(".", ",") + "/5 · " + t("viz.desSeries", g.n)
    };
  }), { unite: "", decimales: 2, colonne: t("viz.genre"), mesure: t("viz.maMoyenne") });


  /* ---------------- 8. L'écart avec le public ---------------- */

  // Ma note sur 5 est ramenée sur 10 pour être comparable au consensus.
  var ecarts = DRAMAS
    .filter(function (d) { return d.note !== null && d.consensus != null; })
    .map(function (d) {
      return { label: d.titre, a: d.note * 2, b: d.consensus, ecart: d.note * 2 - d.consensus };
    })
    .sort(function (x, y) { return y.ecart - x.ecart; });

  var haut = ecarts[0];
  var bas = ecarts[ecarts.length - 1];
  var accords = ecarts.filter(function (e) { return Math.abs(e.ecart) < 0.5; });
  var surcotes = ecarts.filter(function (e) { return e.ecart > 0; });
  var moyen = ecarts.reduce(function (a, e) { return a + Math.abs(e.ecart); }, 0) / ecarts.length;

  function pt(n) { return (Math.round(n * 10) / 10).toString().replace(".", ","); }

  $("ecart-phrase").textContent = t("p.8.p", pt(moyen), haut.label, pt(haut.ecart),
    bas.label, pt(Math.abs(bas.ecart)), accords.length);

  $("ecart-chiffres").innerHTML = [
    [pt(moyen).replace(",", "."), 1, t("p.8.ecart")],
    [surcotes.length, 0, t("p.8.sur")],
    [ecarts.length - surcotes.length, 0, t("p.8.sous")],
    [accords.length, 0, t("p.8.accords")]
  ].map(function (f) {
    return '<div class="figure"><span class="figure__value">' +
      '<span data-compte="' + f[0] + '" data-decimales="' + f[1] + '">0</span></span>' +
      '<span class="figure__label mono">' + f[2] + "</span></div>";
  }).join("");

  Viz.halteres($("graph-ecart"), ecarts, {
    // Aucune note ne descend sous 5 : l'échelle démarre à 4 pour que les
    // écarts soient lisibles, et les deux bornes figurent sur l'axe.
    min: 4,
    max: 10,
    series: [t("p.8.moi"), t("p.8.public")],
    colonne: t("viz.serie")
  });

  document.getElementById("pied").innerHTML = piedDePage("");

  if (window.Anim) window.Anim.rafraichir();
})();
</script>
<script src="assets/anim.js"></script>
<script src="assets/guide.js"></script>
<script src="assets/prefs.js"></script>

</body>
