<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le carnet — Carnet de dramas</title>
<meta name="description" content="Chiffres clés, critiques et derniers visionnages du carnet de dramas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><rect x='7' y='7' width='18' height='18' fill='%23ff5c2b'/></svg>">
<link rel="stylesheet" href="assets/style.css">
<script>(function(){var d=document.documentElement;d.classList.add("js");try{var p=JSON.parse(localStorage.getItem("carnet:prefs")||"{}"),q=new URLSearchParams(location.search);if(q.get("lang"))p.langue=q.get("lang");if(q.get("theme"))p.theme=q.get("theme");if(q.get("lang")||q.get("theme"))localStorage.setItem("carnet:prefs",JSON.stringify(p));if(p.theme&&p.theme!=="defaut")d.setAttribute("data-theme",p.theme);if(p.langue)d.setAttribute("lang",p.langue);}catch(e){}})();</script>
</head>
<body data-page="carnet">

<div class="scroll-progress"><div class="scroll-progress__bar"></div></div>

<header class="bar">
  <a class="bar__logo" href="index.html">Dramas<sup>26</sup></a>
  <a class="bar__link" href="carnet.html" aria-current="page">Le carnet</a>
  <a class="bar__link" href="visionnages.html" data-i18n="nav.visionnages"></a>
  <a class="bar__link bar__link--optionnel" href="moi.html" data-i18n="nav.portrait"></a>
  <span class="bar__spacer"></span>
  <button class="bar__guide" type="button" data-guide><span class="bar__guide__rond">?</span><span data-i18n="nav.guide"></span></button>
  <button class="bar__reglages" type="button" data-reglages><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1 4.5h9M13 4.5h2M1 11.5h3M7 11.5h8"/><circle cx="11.5" cy="4.5" r="1.7"/><circle cx="5.5" cy="11.5" r="1.7"/></svg><span data-i18n="nav.reglages"></span></button>
</header>

<div class="mosaic" id="mosaic" aria-hidden="true"></div>

<div class="wrap opening">
  <p class="opening__kicker reveal" data-i18n="carnet.chapeau"></p>
  <h1 class="opening__title display" data-split data-i18n="carnet.titre"></h1>
  <div class="opening__foot mono reveal">
    <span data-i18n="carnet.auteur"></span>
    <span data-i18n="carnet.depuis"></span>
    <a href="index.html" style="color:inherit" data-i18n="carnet.retourCarrousel"></a>
  </div>
</div>

<div class="figures" id="figures"></div>

<main>

  <section class="wrap section">
    <div class="section__head reveal">
      <h2 class="section__title mono" data-i18n="carnet.critiques"></h2>
      <span class="section__count mono" id="compte-critiques"></span>
    </div>
    <div id="critiques"></div>
  </section>

  <section class="wrap section">
    <div class="section__head reveal">
      <h2 class="section__title mono" data-i18n="carnet.derniers"></h2>
      <a class="section__count mono" href="visionnages.html" style="text-decoration:none">
        <span id="compte-total"></span> &rarr;
      </a>
    </div>
    <div class="index" id="derniers"></div>
  </section>

</main>

<footer class="wrap pied" id="pied"></footer>

<script src="assets/data.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var echelles = preparerConsensus(DRAMAS);
  var stats = calculerStats(DRAMAS);

  // Mosaïque d'ouverture : les affiches les mieux notées, teintées par la charte.
  var pourMosaique = DRAMAS
    .filter(function (d) { return d.affiche !== false; })
    .slice()
    .sort(function (a, b) { return (b.note || 0) - (a.note || 0); })
    .slice(0, 16);

  document.getElementById("mosaic").innerHTML = pourMosaique.map(function (d) {
    return '<div class="mosaic__cell"><img src="' + affiche(d) + '" alt="" loading="eager"></div>';
  }).join("");

  // Les valeurs sont comptées à l'écran par la couche d'animation.
  document.getElementById("figures").innerHTML = [
    [stats.total, 0, "", "visionnages"],
    [stats.moyenne, 2, "em", "ma moyenne / 5"],
    [stats.moyenneConsensus, 1, "", "moyenne du public / 10"],
    [stats.coupsDeCoeur, 0, "", "notes maximales"]
  ].map(function (f) {
    var valeur = '<span data-compte="' + f[0] + '" data-decimales="' + f[1] + '">0</span>';
    if (f[2] === "em") valeur = "<em>" + valeur + "</em>";
    return '<div class="figure reveal"><span class="figure__value">' + valeur +
           '</span><span class="figure__label mono">' + f[3] + "</span></div>";
  }).join("");

  document.getElementById("compte-total").textContent = t("carnet.voirTout", stats.total);

  var avecCritique = DRAMAS.filter(function (d) { return d.critique; });
  document.getElementById("compte-critiques").textContent =
    String(avecCritique.length).padStart(2, "0");

  document.getElementById("critiques").innerHTML = avecCritique.map(function (d) {
    return '<a class="feature reveal" href="' + d.critique + '">' +
      '<div class="feature__media"><img src="' + affiche(d) + '" alt="Affiche de ' + esc(d.titre) + '"></div>' +
      "<div>" +
      '<span class="mono">' + esc(d.critiqueDate) + " &middot; " + esc(d.titre) + "</span>" +
      '<h3 class="feature__title">' + t("critique.titre", esc(d.titre)) + "</h3>" +
      '<p class="feature__excerpt">' + esc(d.critiqueExtrait) + "</p>" +
      '<span class="feature__cta mono">' + t("fiche.lireCritique") + " " + ICONES.fleche + "</span>" +
      "</div></a>";
  }).join("");

  // Six derniers titres consignés, du plus récent au plus ancien.
  document.getElementById("derniers").innerHTML = DRAMAS
    .map(function (d, i) { return { d: d, i: i }; })
    .slice(-6)
    .reverse()
    .map(function (o) { return rangee(o.d, o.i); })
    .join("");

  document.getElementById("pied").innerHTML = piedDePage("");

  if (window.Anim) window.Anim.rafraichir();
})();
</script>
<script src="assets/anim.js"></script>
<script src="assets/guide.js"></script>
<script src="assets/prefs.js"></script>

</body>
</html>
