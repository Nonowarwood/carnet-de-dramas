<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les visionnages — Carnet de dramas</title>
<meta name="description" content="Les 30 dramas visionnés depuis mars 2025 : affiche, synopsis, ma note et celle du public.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><rect x='7' y='7' width='18' height='18' fill='%23ff5c2b'/></svg>">
<link rel="stylesheet" href="assets/style.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="visionnages">

<div class="scroll-progress"><div class="scroll-progress__bar"></div></div>

<header class="bar">
  <a class="bar__logo" href="index.html">Dramas<sup>26</sup></a>
  <a class="bar__link" href="carnet.html">Le carnet</a>
  <a class="bar__link" href="visionnages.html" aria-current="page">Les visionnages</a>
  <a class="bar__link bar__link--optionnel" href="moi.html">Portrait</a>
  <span class="bar__spacer"></span>
  <button class="bar__guide" type="button" data-guide><span>?</span> Guide</button>
</header>

<div class="wrap opening" style="padding-bottom:1.5rem">
  <p class="opening__kicker reveal">
    Dans l'ordre où je les ai regardés. La recherche porte aussi sur les genres
    et les synopsis.
  </p>
  <h1 class="opening__title display" data-split>Les<br>visionnages</h1>
</div>

<main class="wrap section" style="padding-top:1.5rem">

  <div class="toolbar reveal">
    <div class="toolbar__field">
      <input type="search" id="recherche" placeholder="Rechercher" aria-label="Rechercher un titre, un genre, un synopsis">
    </div>
    <div class="toolbar__field">
      <label for="tri">Tri</label>
      <select id="tri">
        <option value="ordre">Ordre de visionnage</option>
        <option value="note-desc">Ma note ↓</option>
        <option value="note-asc">Ma note ↑</option>
        <option value="public-desc">Note du public ↓</option>
        <option value="annee-desc">Année ↓</option>
        <option value="titre">Titre A→Z</option>
      </select>
    </div>
    <div class="toolbar__field">
      <label for="pays">Pays</label>
      <select id="pays">
        <option value="">Tous</option>
        <option value="KR">Corée du Sud</option>
        <option value="JP">Japon</option>
        <option value="CN">Chine</option>
      </select>
    </div>
  </div>

  <div id="liste"></div>

</main>

<footer class="wrap footer mono">
  <span>Carnet personnel &mdash; notes issues de mes visionnages</span>
  <span id="note-sources"></span>
</footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  preparerConsensus(DRAMAS);
  var stats = calculerStats(DRAMAS);

  var champRecherche = document.getElementById("recherche");
  var champTri = document.getElementById("tri");
  var champPays = document.getElementById("pays");
  var conteneur = document.getElementById("liste");

  var TITRES_PERIODE = { "2025": "Depuis mars 2025", "2026": "Depuis 2026" };

  // On fige l'index d'origine : la numérotation ne bouge pas avec les tris.
  var TOUS = DRAMAS.map(function (d, i) { return { d: d, i: i }; });

  function correspond(o, q) {
    if (!q) return true;
    var champs = [o.d.titre, o.d.mention || "",
                  (o.d.genres || []).join(" "), o.d.synopsis || ""];
    return champs.join(" ").toLowerCase().indexOf(q) !== -1;
  }

  // Les non-notés vont en fin de classement plutôt que d'être comptés comme zéro.
  function parNote(sens) {
    return function (a, b) {
      if (a.d.note === null) return 1;
      if (b.d.note === null) return -1;
      return sens * (b.d.note - a.d.note);
    };
  }

  var TRIS = {
    "note-desc": parNote(1),
    "note-asc": parNote(-1),
    "public-desc": function (a, b) { return (b.d.consensus || 0) - (a.d.consensus || 0); },
    "annee-desc": function (a, b) { return (b.d.annee || 0) - (a.d.annee || 0); },
    "titre": function (a, b) { return a.d.titre.localeCompare(b.d.titre, "fr"); }
  };

  function afficher() {
    var q = champRecherche.value.trim().toLowerCase();
    var paysVoulu = champPays.value;
    var tri = champTri.value;

    var liste = TOUS.filter(function (o) {
      return correspond(o, q) && (!paysVoulu || o.d.pays === paysVoulu);
    });

    if (!liste.length) {
      conteneur.innerHTML = '<p class="empty mono">Aucun visionnage ne correspond</p>';
      return;
    }

    // Sans tri explicite, on garde les deux blocs de la note d'origine.
    if (tri === "ordre") {
      conteneur.innerHTML = ["2025", "2026"].map(function (periode) {
        var bloc = liste.filter(function (o) { return o.d.periode === periode; });
        if (!bloc.length) return "";
        return '<div class="group-head reveal"><b>' + TITRES_PERIODE[periode] + "</b>" +
               '<span class="mono">' + String(bloc.length).padStart(2, "0") + " titres</span></div>" +
               '<div class="fiches">' +
               bloc.map(function (o) { return fiche(o.d, o.i); }).join("") +
               "</div>";
      }).join("");
    } else {
      conteneur.innerHTML =
        '<div class="fiches">' +
        liste.slice().sort(TRIS[tri]).map(function (o) { return fiche(o.d, o.i); }).join("") +
        "</div>";
    }

    if (window.Anim) window.Anim.rafraichir(conteneur);
  }

  champRecherche.addEventListener("input", afficher);
  champTri.addEventListener("change", afficher);
  champPays.addEventListener("change", afficher);
  afficher();

  document.getElementById("note-sources").innerHTML =
    "Note du public&nbsp;: MyDramaList (" + DRAMAS.length + " titres) et Viki (" +
    stats.avecViki + "), recentrées avant moyenne";
})();
</script>
<script src="assets/anim.js"></script>
<script src="assets/guide.js"></script>

</body>
</html>
